<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Zap Aço Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
<style>
:root{--bg:#f7f8f7;--fg:#111b16;--muted:#66736c;--zap:#25d366;--line:#e3e8e5;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1411;--fg:#eaf2ed;--muted:#8fa199;--line:#1f2b26;--card:#121c18}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,sans-serif;display:grid;place-items:center;padding:24px;overflow:hidden}
main{position:relative;z-index:1;text-align:center;max-width:460px;width:100%}
.logo{width:72px;height:72px;margin:0 auto 22px;border-radius:22px;background:var(--zap);display:grid;place-items:center;color:#fff;box-shadow:0 12px 32px rgba(37,211,102,.3)}
.logo svg{width:40px;height:40px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
p{color:var(--muted);margin:10px 0 32px;line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:300px;padding:15px 22px;border-radius:14px;background:var(--zap);color:#062b16;font-weight:700;font-size:16px;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
small{display:block;margin-top:28px;font-size:12px;color:var(--muted)}
/* rede de pessoas trocando mensagens */
svg.net{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.net line{stroke:var(--line);stroke-width:1.5}
.net .p{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.net .d{fill:var(--zap)}
@media(prefers-reduced-motion:reduce){.net .d{display:none}}
</style>
</head>
<body>

<svg class="net" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g id="links"></g><g id="people"></g><g id="dots"></g>
</svg>

<main>
  <div class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.9-1.1-4.7-4-4.9-4.2-.1-.2-1.2-1.6-1.2-3s.8-2.2 1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.2.2-.3.4-.1.7.2.3.8 1.4 1.8 2.2 1.3 1.1 2.3 1.4 2.6 1.6.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 .9c.3.2.5.2.6.4 0 .1 0 .7-.2 1.2Z"/></svg></div>
  <h1>Zap Aço Brasil</h1>
  <p>Plataforma interna de mensagens do Grupo Aço Brasil.<br>Conectando nossa equipe em cada conversa.</p>
  <a class="btn" href="https://atendimento.grupoacobrasil.com.br">Entrar na plataforma →</a>
  <small>Acesso restrito a colaboradores</small>
</main>

<script>
(function(){
  var ns='http://www.w3.org/2000/svg',P=[[120,140],[260,520],[400,90],[620,600],[820,160],[900,470],[80,380],[560,250],[720,360],[330,330],[180,640],[940,620]];
  var E=[[0,2],[0,6],[6,1],[1,9],[9,2],[2,7],[7,4],[4,8],[8,5],[5,3],[3,1],[9,7],[8,3],[6,10],[10,1],[5,11],[3,11]];
  var L=document.getElementById('links'),G=document.getElementById('people'),D=document.getElementById('dots');
  E.forEach(function(e){var l=document.createElementNS(ns,'line');l.setAttribute('x1',P[e[0]][0]);l.setAttribute('y1',P[e[0]][1]);l.setAttribute('x2',P[e[1]][0]);l.setAttribute('y2',P[e[1]][1]);L.appendChild(l)});
  P.forEach(function(p){var c=document.createElementNS(ns,'circle');c.setAttribute('class','p');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',14);G.appendChild(c)});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  function send(){
    var e=E[Math.floor(Math.random()*E.length)],a=P[e[0]],b=P[e[1]];if(Math.random()<.5){var t=a;a=b;b=t}
    var c=document.createElementNS(ns,'circle');c.setAttribute('class','d');c.setAttribute('r',5);D.appendChild(c);
    var s=performance.now(),T=1600;
    (function f(n){var k=Math.min((n-s)/T,1);c.setAttribute('cx',a[0]+(b[0]-a[0])*k);c.setAttribute('cy',a[1]+(b[1]-a[1])*k);c.setAttribute('opacity',k<.9?1:(1-k)*10);k<1?requestAnimationFrame(f):c.remove()})(s);
  }
  setInterval(send,450);
})();
</script>
</body>
</html>
